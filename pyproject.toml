[project]
name = "agent-platform"
version = "0.1.0"
description = "Enterprise multi-agent orchestration platform (campus recruitment flagship project)"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "langgraph>=1.0",
    "langchain-openai>=0.3",
    "litellm>=1.50",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "mcp>=1.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "langchain>=1.4.0",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_platform"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

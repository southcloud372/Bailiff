# 目标基础设施：PostgreSQL(pgvector) + Redis + Ollama（本地嵌入）
# 用法：docker compose up -d  （详见 docs/docker-setup.md）
# Langfuse（可观测）为可选组件，后续并入本文件或单独编排。

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: agent-db
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent_platform
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: agent-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 本地嵌入模型（OpenAI 兼容端点 /v1/embeddings），无外部 API key 依赖。
  # 首次需手动拉取模型：docker exec -it agent-ollama ollama pull bge-m3
  ollama:
    image: ollama/ollama:latest
    container_name: agent-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  ollama:
